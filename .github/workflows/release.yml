name: Release

# Compile l'app universelle et publie une release :
#  - à chaque tag vX.Y.Z poussé,
#  - ou à la main : onglet Actions › Release › Run workflow (la version est lue dans Info.plist
#    si le champ est laissé vide ; le tag vX.Y.Z est créé par la release),
#  - ou par un commit sur main dont le message contient [release] (version lue dans Info.plist).
on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (vide = celle d'Info.plist)"
        required: false

permissions:
  contents: write

jobs:
  release:
    if: github.event_name != 'push' || github.ref_type == 'tag' || contains(github.event.head_commit.message, '[release]')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            V="${{ inputs.version }}"
          else
            V=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist)
          fi
          echo "VERSION=${V#v}" >> "$GITHUB_ENV"
          echo "TAG=v${V#v}" >> "$GITHUB_ENV"

      - name: Build (universal)
        run: ./build.sh

      - name: Package
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent Ruche.app "Ruche-${VERSION}.zip"
          shasum -a 256 "Ruche-${VERSION}.zip" | tee "Ruche-${VERSION}.zip.sha256"

      - name: Release notes
        run: |
          # Section du CHANGELOG correspondant à la version, sinon texte par défaut.
          awk -v v="## $VERSION" '$0 ~ "^## " { p = (index($0, v) == 1) ; next } p' CHANGELOG.md > notes.md || true
          [ -s notes.md ] || echo "Ruche $VERSION" > notes.md
          cat >> notes.md <<'NOTES'

          ---
          **Installation** — unzip, move **Ruche.app** to `/Applications`, then (ad-hoc signed app):
          ```bash
          xattr -dr com.apple.quarantine /Applications/Ruche.app
          ```
          Universal (Apple Silicon & Intel), macOS 14+.
          NOTES

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "build/Ruche-${VERSION}.zip" "build/Ruche-${VERSION}.zip.sha256" \
            --target "$GITHUB_SHA" --title "Ruche ${VERSION}" --notes-file notes.md
